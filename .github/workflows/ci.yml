name: Mathematical checks and smoke run

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/work/cache/pip
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/work/cache/pycache
      TMPDIR: ${{ github.workspace }}/work/temp
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Create project-local scratch directories
        run: mkdir -p work/temp work/cache
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Verify mathematical identities and accounting
        run: python -m unittest discover -s tests -v
      - name: Run tiny integration example
        run: python -m coordinate_geometry.smoke --config configs/smoke.json --output outputs/smoke
      - name: Verify Module 1 trajectories and saved artifacts
        run: |
          python -m coordinate_geometry.part1_experiments --config configs/part1.json --output outputs/part1 --no-plots
          python -m coordinate_geometry.verify_part1 --output outputs/part1
      - name: Run Module 2 mechanism diagnostic
        run: python -m coordinate_geometry.adam_diagnostics --config configs/adam_diagnostics.json --output outputs/adam_diagnostics
      - name: Verify Module 4 preconditioning reference
        run: python -m coordinate_geometry.part4_experiments --output outputs/part4 --no-plots
      - name: Verify Module 5 trajectories and saved artifacts
        run: |
          python -m coordinate_geometry.part5_experiments --config configs/part5.json --output outputs/part5 --no-plots
          python -m coordinate_geometry.verify_part5 --output outputs/part5
      - name: Run Module 3 pipeline smoke and verify saved artifacts
        run: |
          python -m coordinate_geometry.part3_experiments --config configs/part3_smoke.json --output outputs/part3_smoke --stage all
          python -m coordinate_geometry.verify_part3 --output outputs/part3_smoke
